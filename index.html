<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe semanal · Avance del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFCFB;--ink:#0B2E1E;--muted:#456455;--glass:#FFFFFF;--gl:rgba(1,84,49,.15);--sh:0 1px 2px rgba(1,84,49,.06),0 16px 32px -20px rgba(1,84,49,.35);
  --c1:#0F8653;--c2:#0B7F86;--c3:#9A6200;--c4:#C4483A;--nx:#2EA66D;--idle:#7FA28F;--accent:#0F8653;--accent-ink:#FFFFFF;
  --a1:rgba(46,166,109,.16);--a2:rgba(134,213,177,.24);--a3:rgba(15,134,83,.08);--mask:none;
  --head:"Sora","Segoe UI",system-ui,sans-serif;--body:"Public Sans","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04130C;--ink:#E7F5EE;--muted:#9CBBAA;--glass:rgba(255,255,255,.06);--gl:rgba(255,255,255,.14);--sh:none;
  --c1:#3FCB8B;--c2:#4FC6D0;--c3:#F0B455;--c4:#F28474;--nx:#8BE0B8;--idle:#5E7E6D;--accent:#3FCB8B;--accent-ink:#03150C;
  --a1:rgba(63,203,139,.20);--a2:rgba(15,134,83,.28);--a3:rgba(139,224,184,.10);--mask:linear-gradient(to bottom,transparent,#000 24%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#04130C;--ink:#E7F5EE;--muted:#9CBBAA;--glass:rgba(255,255,255,.06);--gl:rgba(255,255,255,.14);--sh:none;
  --c1:#3FCB8B;--c2:#4FC6D0;--c3:#F0B455;--c4:#F28474;--nx:#8BE0B8;--idle:#5E7E6D;--accent:#3FCB8B;--accent-ink:#03150C;
  --a1:rgba(63,203,139,.20);--a2:rgba(15,134,83,.28);--a3:rgba(139,224,184,.10);--mask:linear-gradient(to bottom,transparent,#000 24%);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:400 1rem/1.55 var(--body);-webkit-text-size-adjust:100%;min-height:100dvh}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40rem 28rem at 15% 10%,var(--a1),transparent 70%),radial-gradient(36rem 26rem at 90% 25%,var(--a2),transparent 70%),radial-gradient(34rem 24rem at 50% 95%,var(--a3),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(2%,-3%,0) scale(1.06)}}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:74rem;margin:0 auto;padding:0 1.5rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:600 1rem/1 var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:2rem;padding:1rem 1.6rem;min-height:3rem;cursor:pointer;text-decoration:none;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
:is(.btn,button,input,a):focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--gl);box-shadow:var(--sh)}

.hero{padding:3.5rem 0 1.5rem}
.hero h1{font-size:clamp(2.4rem,7vw,4.8rem);font-weight:800;max-width:14ch;text-wrap:balance;
  color:var(--ink);background:linear-gradient(100deg,var(--ink) 25%,var(--c1) 70%,var(--nx));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{margin:1.1rem 0 1.75rem;color:var(--muted);font-size:1.15rem;max-width:36rem;text-wrap:pretty}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;max-width:34rem;margin-bottom:1.6rem}
.day{padding:.65rem .3rem;border-radius:1rem;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.2}
.day b{display:block;font:700 1.25rem var(--head);color:var(--ink)}
.day.past{opacity:.5}
.day.now{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 28px -10px var(--accent)}
.day.now b{color:var(--accent-ink)}
.cta{display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.88rem;color:var(--muted)}
.sim input{font:400 .92rem var(--body);min-height:2.5rem;padding:.3rem .6rem;color:var(--ink);background:var(--glass);border:1px solid var(--gl);border-radius:.6rem}
.sim button{min-height:2.5rem;padding:.3rem .9rem;font:600 .88rem var(--body);color:var(--ink);background:transparent;border:1px solid var(--gl);border-radius:2rem;cursor:pointer}

section{padding:2.25rem 0}
.sh{display:flex;align-items:center;gap:.8rem;margin-bottom:1.1rem}
.sh i{width:.7rem;height:.7rem;border-radius:50%;background:var(--k);box-shadow:0 0 0 .35rem color-mix(in srgb,var(--k) 22%,transparent)}
.sh h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700}
.band{display:grid;grid-template-columns:auto 1fr auto;gap:1rem 2rem;align-items:center;padding:1.5rem 1.75rem;border-radius:1.5rem;margin-bottom:1rem;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0 auto 0 0;width:.35rem;background:var(--k)}
.ver{font:800 clamp(2.8rem,8vw,4.6rem)/1 var(--head);letter-spacing:-.04em}
.wk b{display:block;font:700 1.15rem var(--head)}.wk span{color:var(--muted);font-size:.93rem}
.mix{margin-top:.9rem}
.stack{display:flex;height:.55rem;border-radius:1rem;overflow:hidden;background:color-mix(in srgb,var(--idle) 30%,transparent)}
.stack i{display:block;height:100%}
.leg{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin:.5rem 0 0;padding:0;font-size:.8rem;color:var(--muted)}
.leg i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.35rem}
.ring{position:relative;width:5.5rem;height:5.5rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:color-mix(in srgb,var(--idle) 30%,transparent)}
.ring .pg{stroke:var(--k);transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 1.15rem/1.1 var(--head)}
.ring small{display:block;font:400 .68rem var(--body);color:var(--muted)}

.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19.5rem),1fr));gap:1rem}
.t{position:relative;display:grid;gap:.8rem;align-content:start;padding:1.25rem 1.3rem;border-radius:1.25rem;overflow:hidden;isolation:isolate;transition:transform .25s,border-color .25s;animation:rev .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.t::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(18rem circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 26%,transparent),transparent 65%)}
.t:hover{transform:translateY(-4px);border-color:var(--c)}.t:hover::before{opacity:1}
.t .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.id{font:800 1.3rem var(--head);letter-spacing:-.02em}
.tp{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:.25rem .7rem;border-radius:2rem}
.tp::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--c)}
.d{font-size:.98rem;text-wrap:pretty}
.meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:.5rem;margin:0;padding-top:.8rem;border-top:1px solid var(--gl)}
.meta dt{font-size:.7rem;color:var(--muted);text-transform:none}
.meta dd{margin:0;font-size:.85rem;font-weight:600}
.st{display:inline-flex;align-items:center;gap:.4rem}
.st::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--s)}
.empty{padding:2rem;border-radius:1.25rem;color:var(--muted);border-style:dashed}
@keyframes rev{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.foot{padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.85rem}

@media (max-width:700px){.topbar{aspect-ratio:auto;height:3.75rem;background-size:auto 100%;background-position:left center}.wave{aspect-ratio:auto;height:6rem;background-size:auto 100%}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{padding:1.1rem 0 .25rem}
.bar-in{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between}
.acts{display:flex;flex-wrap:wrap;gap:.6rem}
.bar .btn{padding:.8rem 1.25rem;min-height:2.75rem}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--accent)}
.btn.alt:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sim{margin-left:auto}
.lv{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;padding:.25rem .7rem;border:1px solid var(--gl);border-radius:2rem;background:var(--glass);color:var(--ink)}
.lv::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--idle)}
.lv.on::before{background:var(--c1);box-shadow:0 0 0 .25rem color-mix(in srgb,var(--c1) 25%,transparent)}
.lv.err::before{background:var(--c4)}
.note{margin-top:1rem;padding:.9rem 1.1rem;border-radius:.9rem;border:1px dashed var(--c3);background:color-mix(in srgb,var(--c3) 10%,transparent);font-size:.92rem}
@media (max-width:760px){.band{grid-template-columns:1fr auto}.band .wk{grid-column:1/-1;order:3}.band .mixw{grid-column:1/-1;order:4}}
@media (max-width:480px){
  .wrap{padding:0 1.1rem}.hero{padding:2.25rem 0 1rem}.btn{width:100%;justify-content:center}
  .band{padding:1.1rem;border-radius:1.2rem}.ring{width:4.6rem;height:4.6rem}
  .t{padding:1.05rem}.day{font-size:.7rem;padding:.55rem .15rem}.day b{font-size:1.05rem}.days{gap:.35rem}
  .meta{grid-template-columns:repeat(2,auto);row-gap:.6rem}
}
@media (prefers-reduced-motion:reduce){body::after,.t{animation:none}.t,.btn,.ring .pg{transition:none}html{scroll-behavior:auto}}

</div></nav>

<main>
<section id="semana"><div class="wrap">
  <div class="sh" style="--k:var(--c1)"><i></i><h2>Entrega de la semana</h2></div>
  <div id="cur"></div>
  <p class="note" id="nosem" hidden></p>
</div></section>
<section id="prox"><div class="wrap">
  <div class="sh" style="--k:var(--nx)"><i></i><h2>Próxima entrega</h2></div>
  <div id="nxt"></div>
</div></section>
</main>

<footer class="foot"><div class="wrap" id="foot" aria-live="polite"></div></footer>
<div class="wave" aria-hidden="true"></div>

<script>
(function(){
var TY={F:["Funcionalidad","--c1"],M:["Mejora","--c2"],D:["Defecto","--c4"],T:["Tarea","--c3"]};
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],DIA=["dom","lun","mar","mié","jue","vie","sáb"];
TY.O=["Otro","--idle"];
var FILE_ID="12IDoks1u2eKK3QWtxmhxZk1pPInF1hMc",SERVER="Google Drive",TOOL="read_file_content";
var SNAP=`V-1.5 Numero ,Descripcion,Estado,Tipo,,Semana OT-25, Recepcion de novedad de pre firma en banca,para deploy TS,Funcionalidad,, OT-20, Subtrámite: alta de regla de compensación,para deploy TS,Funcionalidad,, OT-23 ,Subtrámite: alta de adhesion de seguros,para deploy TS,Funcionalidad,, OT-154 ,[BUG] ONLINE - Servicio de consulta de administrador de productos OT-15. La columna “Asociaciones” de la grilla no coincide con la cantidad de módulos asociados mostrados en el detalle del producto,para deploy TS,Defecto ,, OT-177,Online - ABM Admin de Prod - Mejoras en la interfaz,para deploy TS,Mejora,, OT-207, [BUG] Subtrámite: Alta de persona con validación de RENAPER. OT-10. Valores incorrectos de codProvSipago en core.parametria.,para deploy TS,Defecto,, V-1.6 Numero ,Descripcion,Estado,Tipo,,,Semana ,08/11,12/11 OT-31, Subtrámite: alta de sipago,Backlog,Funcionalidad,,,,, OT-13 ,Subtrámite: alta de tarjeta crédito cabal,Backlog,Funcionalidad,,,,, OT-12 ,Subtrámite: alta de tarjeta crédito visa,Backlog,Funcionalidad,,,,, OT-209,Alta de TC CABAL - Cambios en el servicio-OT13,Backlog,Funcionalidad,,,,, OT-208,Alta de TC VISA - Cambios en el servicio -OT12,Backlog,Funcionalidad,,,,,`;
var V=[],NS=[];
function normEstado(s){var l=s.toLowerCase();return l.indexOf("entreg")>=0?"Entregado":l.indexOf("deploy")>=0?"Para deploy en TS":l.indexOf("backlog")>=0?"Backlog":s.charAt(0).toUpperCase()+s.slice(1);}
function normTipo(s){var l=s.toLowerCase();return l.indexOf("func")===0?"F":l.indexOf("mejora")===0?"M":l.indexOf("defecto")===0?"D":l.indexOf("tarea")===0?"T":"O";}
function dm(d,mo,y){var n=new Date(),best=null;
  if(y){y=+y;if(y<100)y+=2000;return new Date(y,mo-1,d);}
  [n.getFullYear()-1,n.getFullYear(),n.getFullYear()+1].forEach(function(yy){var c=new Date(yy,mo-1,d);if(!best||Math.abs(c-n)<Math.abs(best-n))best=c;});
  return best;}
function parseSheet(txt){
  txt=String(txt).replace(/\\([\[\]_\\])/g,"$1");
  var hre=/(V-?\d+(?:\.\d+)*)\s+Numero\s*,\s*Descripcion\s*,\s*Estado\s*,\s*Tipo/g,m,heads=[];
  while((m=hre.exec(txt)))heads.push({n:m[1],a:m.index+m[0].length,b:m.index});
  var out=[],sin=[];
  heads.forEach(function(h,i){
    var blk=txt.slice(h.a,i+1<heads.length?heads[i+1].b:txt.length),fr=blk.search(/OT-\d+\s*,/);
    if(fr<0)return;
    var pre=blk.slice(0,fr),body=blk.slice(fr),t=[],r;
    var rowRe=/OT-(\d+)\s*,\s*("(?:[^"]|"")*"|[^,]*),([^,]*),([^,]*?),*(?=\s+OT-\d|\s*$)/g;
    while((r=rowRe.exec(body))){
      var d=r[2].trim();if(d.charAt(0)==='"')d=d.slice(1,-1).replace(/""/g,'"');
      t.push(["OT-"+r[1],d.trim(),normEstado(r[3].trim()),normTipo(r[4].trim())]);}
    if(!t.length)return;
    var sm=pre.match(/Semana\s*,\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*,\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
    if(!sm){sin.push({v:h.n,t:t});return;}
    var s=dm(+sm[1],+sm[2],sm[3]),mo=monday(s),fri=new Date(mo);fri.setDate(fri.getDate()+4);
    out.push({v:h.n,s:iso(mo),e:iso(fri),t:t});
  });
  out.sort(function(a,b){return a.s<b.s?-1:a.s>b.s?1:0;});
  return {v:out,sin:sin};
}

function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fd(d){return DIA[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()];}
function sd(d){return d.getDate()+" "+MES[d.getMonth()];}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),w=x.getDay();
  if(w===0)x.setDate(x.getDate()+1);else if(w===6)x.setDate(x.getDate()+2);else x.setDate(x.getDate()-(w-1));return x;}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

function card(v,i){return function(t,j){
  var ty=TY[t[3]],bk=t[2]==="Backlog";
  return '<li class="t glass" style="--c:var('+ty[1]+');--i:'+j+'"><div class="top"><span class="id">'+esc(t[0])+'</span><span class="tp">'+ty[0]+'</span></div><p class="d">'+esc(t[1])+'</p>'+
  '<dl class="meta"><div><dt>Estado</dt><dd class="st" style="--s:var('+(bk?"--idle":"--c1")+')">'+esc(t[2])+'</dd></div><div><dt>Versión</dt><dd>'+v.v+'</dd></div><div><dt>Semana</dt><dd>'+sd(pd(v.s))+' – '+sd(pd(v.e))+'</dd></div></dl></li>';};}
function ring(k,val,max,big,small){
  var C=2*Math.PI*26,off=C*(1-Math.min(val/max,1));
  return '<div class="ring" style="--k:var('+k+')"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="tr" cx="32" cy="32" r="26"/><circle class="pg" cx="32" cy="32" r="26" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><span>'+big+'<small>'+small+'</small></span></div>';
}
function sector(el,v,k,msg,rg){
  if(!v){el.innerHTML='<div class="empty glass">'+msg+'</div>';return;}
  var c={F:0,M:0,D:0,T:0},seg="",lg="";v.t.forEach(function(t){c[t[3]]++;});
  Object.keys(c).forEach(function(x){if(c[x]){seg+='<i style="width:'+(c[x]/v.t.length*100)+'%;background:var('+TY[x][1]+')" title="'+TY[x][0]+': '+c[x]+'"></i>';lg+='<li><i style="background:var('+TY[x][1]+')"></i>'+TY[x][0]+' '+c[x]+'</li>';}});
  el.innerHTML='<div class="band glass" style="--k:var('+k+')"><div class="ver">'+v.v+'</div><div class="wk"><b>'+fd(pd(v.s))+' – '+fd(pd(v.e))+'</b><span>'+rg.txt+'</span></div>'+ring(k,rg.val,rg.max,rg.big,rg.small)+
  '<div class="mixw" style="grid-column:1/-1"><b>'+v.t.length+' tickets en esta versión</b><div class="mix"><div class="stack" role="img" aria-label="Tickets por tipo">'+seg+'</div><ul class="leg">'+lg+'</ul></div></div></div><ul class="grid">'+v.t.map(card(v)).join("")+'</ul>';
}
function render(){
  var today=$("sim").value?pd($("sim").value):new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var mon=monday(today),w=today.getDay(),wk=w===0||w===6,cur=null,nxt=null;
  V.forEach(function(v){var s=pd(v.s),e=pd(v.e);if(s<=mon&&mon<=e)cur=v;else if(s>mon&&!nxt)nxt=v;});
  var elapsed=wk?(w===6?5:0):w;
  sector($("cur"),cur,"--c1","No hay una entrega planificada para esta semana en la planilla.",
    {txt:wk?"La semana empieza el lunes":(w===5?"Hoy es el último día de la semana":"Quedan "+(6-w)+" días hábiles, hoy incluido"),val:elapsed,max:5,big:elapsed+"/5",small:"días"});
  var ns=NS.filter(function(x){return x.t.some(function(t){return t[2]!=="Entregado";});}).map(function(x){return x.v+" ("+x.t.length+" tickets)";});
  $("nosem").hidden=!ns.length;if(ns.length)$("nosem").innerHTML="En el Excel hay versiones pendientes sin semana asignada: <b>"+esc(ns.join(", "))+"</b>. Agrega su fila «Semana» para que aparezcan en su sector.";
  var dd=nxt?Math.round((pd(nxt.s)-today)/864e5):0;
  sector($("nxt"),nxt,"--nx","Todavía no hay una próxima entrega cargada en la planilla.",
    {txt:dd<=0?"Comienza esta semana":"Comienza en "+dd+(dd===1?" día":" días"),val:Math.max(0,7-dd),max:7,big:dd,small:dd===1?"día":"días"});
  document.querySelectorAll(".t").forEach(function(c){c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px");});});
}
function apply(txt,ts){var r=parseSheet(txt);V=r.v;NS=r.sin;render();}
function hhmm(ts){var d=new Date(ts||Date.now());return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function foot(m){$("foot").textContent=m;}
function textOf(res){var p=res&&res.payload,j;
  if(p&&typeof p==="object"&&p.fileContent!=null)return p.fileContent;
  if(typeof p==="string"){try{j=JSON.parse(p);if(j&&j.fileContent!=null)return j.fileContent;}catch(e){}return p;}
  var b=res&&res.content&&res.content[0]&&res.content[0].text;
  if(b){try{j=JSON.parse(b);if(j&&j.fileContent!=null)return j.fileContent;}catch(e){}return b;}
  return null;}
var SNAPMSG="Mostrando la captura del 2 de noviembre de 2026 de «planilla de tickets» (carpeta CREDICOOP).";
$("sim").addEventListener("change",render);
$("hoy").addEventListener("click",function(){$("sim").value=iso(new Date());render();});
$("sim").value=iso(new Date());
apply(SNAP);foot(SNAPMSG);setLv("","Captura");
var mcpH=null,busy=false;
function setLv(c,t){var e=$("lv");e.className="lv "+c;e.textContent=t;}
function pull(){
  if(!mcpH||busy)return;busy=true;
  mcpH.callTool(SERVER,TOOL,{fileId:FILE_ID},{cache:false}).then(function(res){
    var tx=textOf(res);if(!tx)throw{code:"empty"};
    var r=parseSheet(tx);if(!r.v.length&&!r.sin.length)throw{code:"format"};
    V=r.v;NS=r.sin;render();
    setLv("on","En vivo · "+hhmm());
    foot("Datos leídos de «planilla de tickets» en Drive a las "+hhmm()+". Se actualizan solos cada 30 segundos y al volver a esta pestaña.");
  }).catch(function(e){var c=e&&e.code;
    setLv("err","Sin datos en vivo");
    foot(c==="server_not_connected"?"Google Drive no está conectado en tu cuenta de Claude. "+SNAPMSG:
      c==="needs_reauth"?"Hay que volver a autorizar Google Drive en Claude. "+SNAPMSG:
      (c==="not_granted"||c==="approval_required"||c==="blocked_by_policy")?"No diste permiso a la página para leer Drive. Pulsa «Actualizar» para que lo vuelva a pedir. "+SNAPMSG:
      c==="format"||c==="empty"?"Drive respondió, pero la planilla no tiene el formato esperado. "+SNAPMSG:
      "No se pudo leer Drive ("+(c||"error")+"). Se muestran los últimos datos disponibles.");
  }).then(function(){busy=false;});
}
if(window.claude&&claude.use){claude.use("mcp").then(function(m){
  if(!m){setLv("err","Sin Drive en esta vista");foot("Esta vista no permite conectar con Drive. Abre la página desde su enlace en claude.ai; si la descargaste o la subiste a otro sitio, solo muestra la captura. "+SNAPMSG);return;}
  mcpH=m;$("rf").hidden=false;$("rf").addEventListener("click",pull);
  pull();
  setInterval(function(){if(!document.hidden)pull();},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pull();});
}).catch(function(){setLv("err","Sin Drive en esta vista");});}
else{setLv("err","Sin Drive en esta vista");foot("Esta vista no permite conectar con Drive. Abre la página desde su enlace en claude.ai; si la descargaste o la subiste a otro sitio, solo muestra la captura. "+SNAPMSG);}
})();
</script>
